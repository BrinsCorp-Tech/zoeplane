name: CI

# Runs on every pull request into main or develop.  The four job types (lint,
# typecheck, test, build) are delegated to the reusable _build-matrix.yml
# workflow (Sprint 2 MED-3 consolidation).  CI-only jobs (scaffold-health,
# actionlint, design-tokens-check) remain inline here.
#
# Branch protection on main/develop should require these status checks:
#   lint (macos-latest / windows-latest / ubuntu-22.04)
#   typecheck (macos-latest / windows-latest / ubuntu-22.04)
#   test (macos-latest / windows-latest / ubuntu-22.04)
#   build (macos-latest / windows-latest / ubuntu-22.04)
#   design-tokens-check
#   Scaffold Health
#   Workflow Lint (actionlint)
# This is a repo-settings action, not a workflow change.
# See docs/stories/epic-02/SPRINT-2-CARRYOVERS.md for the required-check list.

on:
  pull_request:
    branches: [main, develop]

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # matrix: delegates lint / typecheck / test / build to the reusable workflow.
  # scaffold-health is excluded from the matrix (CI-only, platform-invariant).
  # ──────────────────────────────────────────────────────────────────────────────
  matrix:
    name: Build Matrix
    uses: ./.github/workflows/_build-matrix.yml
    with:
      artifact-name-prefix: tauri-artifacts
      artifact-retention-days: 7

  # design-tokens-check: verifies the token pipeline can produce a valid
  # tokens.css from the DTCG seed JSON. Runs on ubuntu-latest only.
  # tokens.css is gitignored — CI rebuilds from seed on every run, so this
  # is a pipeline-health check, not a drift check. Direct-edit drift is
  # blocked locally by the Husky pre-commit hook (Story 2.1).
  # Fails if Style Dictionary exits non-zero or produces an empty output file.
  # Fix: check tokens.seed.json for syntax errors or invalid token references.
  design-tokens-check:
    name: Design Tokens Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check token drift
        run: bun run tokens:check

  # ──────────────────────────────────────────────────────────────────────────────
  # scaffold-health: fast pre-flight checks that are platform-invariant.
  # Runs on ubuntu only (these checks have no platform-specific logic).
  # Failures here mean the repo is in a broken state before Rust even compiles.
  # ──────────────────────────────────────────────────────────────────────────────
  scaffold-health:
    name: Scaffold Health
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify Tauri icons present
        run: |
          missing=0
          for f in 32x32.png 128x128.png 128x128@2x.png icon.icns icon.ico; do
            if [ ! -f "src-tauri/icons/$f" ]; then
              echo "::error file=src-tauri/icons/$f::missing icon (declared in tauri.conf.json bundle.icon)"
              missing=1
            fi
          done
          exit $missing
      - name: Verify icon master present
        run: test -f src-tauri/icons/icon-master.png || { echo "::error::icon-master.png missing — required for icon regeneration"; exit 1; }
      - name: Verify sidecar entry exists
        run: test -f sidecar/src/index.ts
      - name: Verify migrations directory non-empty
        run: ls sidecar/src/db/migrations/*.sql > /dev/null

  # ──────────────────────────────────────────────────────────────────────────────
  # actionlint: lint GitHub Actions workflow YAML for correctness.
  # Standalone job — no matrix needed; platform-invariant.
  # ──────────────────────────────────────────────────────────────────────────────
  actionlint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-pr-check
          fail_level: error

  # ──────────────────────────────────────────────────────────────────────────────
  # summary: publish a results table to the GitHub Actions step summary.
  # Runs after all jobs regardless of outcome (if: always()).
  # ──────────────────────────────────────────────────────────────────────────────
  summary:
    name: Summary
    runs-on: ubuntu-22.04
    needs: [matrix, design-tokens-check, scaffold-health, actionlint]
    if: always()
    steps:
      - name: Publish results table
        run: |
          {
            echo "# CI Matrix Results"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Build Matrix (lint / typecheck / test / build) | ${{ needs.matrix.result }} |"
            echo "| Design Tokens Check | ${{ needs.design-tokens-check.result }} |"
            echo "| Scaffold Health | ${{ needs.scaffold-health.result }} |"
            echo "| Workflow Lint (actionlint) | ${{ needs.actionlint.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
