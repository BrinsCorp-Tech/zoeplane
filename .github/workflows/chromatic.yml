name: Chromatic
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  chromatic:
    name: Visual regression (Chromatic)
    runs-on: ubuntu-latest
    env:
      CHROMATIC_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    # OPERATOR ACTION: provision CHROMATIC_PROJECT_TOKEN as a GitHub Actions secret
    # (chromatic.com → project settings → manage → copy token → GitHub repo settings → secrets)
    # Until provisioned, all steps below skip gracefully via the env-gated `if:` guard.
    # Once provisioned, advisory mode runs (exitZeroOnChanges until Story 2.13 baseline-lock).
    steps:
      - if: env.CHROMATIC_TOKEN != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required by Chromatic for baseline comparisons

      - if: env.CHROMATIC_TOKEN != ''
        name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - if: env.CHROMATIC_TOKEN != ''
        name: Install dependencies
        run: bun install --frozen-lockfile

      - if: env.CHROMATIC_TOKEN != ''
        name: Generate design tokens
        run: bun run tokens:build # tokens.css is gitignored; must be regenerated before SB build

      - if: env.CHROMATIC_TOKEN != ''
        name: Run Chromatic
        uses: chromaui/action@v11
        with:
          projectToken: ${{ env.CHROMATIC_TOKEN }}
          buildScriptName: build-storybook
          exitZeroOnChanges: true # ADVISORY MODE — until Story 2.13 baseline-lock
          onlyChanged: true # TurboSnap — capture only stories affected by the diff
