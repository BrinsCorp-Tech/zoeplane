name: Nightly

# Runs daily at 07:00 UTC against main.
# Also dispatchable manually for ad-hoc verification.
# Executes the same lint/typecheck/test/build matrix as ci.yml.
# Artifact summaries are uploaded so failures are easy to triage from the
# workflow run page without downloading the full run log.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # lint: ESLint flat config across all workspaces
  # ──────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (ESLint)
        run: bun run lint

  # ──────────────────────────────────────────────────────────────────────────────
  # typecheck: tsc --noEmit across all workspaces
  # ──────────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: bun run typecheck

  # ──────────────────────────────────────────────────────────────────────────────
  # test: Vitest unit tests across all platforms
  # ──────────────────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests (Vitest)
        run: bun run test

      - name: Check tokens completeness
        run: |
          bun run --cwd packages/design-tokens check-tokens || echo "TODO: token-completeness check not yet implemented"

  # ──────────────────────────────────────────────────────────────────────────────
  # build: unsigned Tauri platform builds
  # Artifacts uploaded for every leg so nightly regressions are easy to triage.
  # ──────────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build UI
        run: bun run --cwd src build

      - name: Build sidecar (bun single-binary)
        run: bun run --cwd sidecar build

      - name: Tauri build (unsigned)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Tauri artifacts
        # Upload on success AND failure so infra failures still produce artifacts
        # (or a clear absence of them) distinguishable from build failures.
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-artifacts-${{ matrix.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: ignore
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────────
  # summary: collect job statuses and write a run-level summary
  # Runs after all build legs complete (or fail) and is always executed.
  # ──────────────────────────────────────────────────────────────────────────────
  summary:
    name: Nightly Summary
    runs-on: ubuntu-22.04
    needs: [lint, typecheck, test, build]
    if: always()

    steps:
      - name: Write run summary
        run: |
          echo "## Nightly Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| typecheck | ${{ needs.typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts retained for 14 days. See individual job logs for details." >> $GITHUB_STEP_SUMMARY
