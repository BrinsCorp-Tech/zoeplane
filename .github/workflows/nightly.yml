name: Nightly

# Runs daily at 07:00 UTC against main.
# Also dispatchable manually for ad-hoc verification.
# Delegates lint / typecheck / test / build to the reusable _build-matrix.yml
# workflow (Sprint 2 MED-3 consolidation).
# Artifact summaries are uploaded so failures are easy to triage from the
# workflow run page without downloading the full run log.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # matrix: delegates lint / typecheck / test / build to the reusable workflow.
  # checkout-ref: main ensures nightly always runs against the release branch.
  # artifact-retention-days: 14 gives nightly a longer triage window than CI PRs.
  # ──────────────────────────────────────────────────────────────────────────────
  matrix:
    name: Build Matrix
    uses: ./.github/workflows/_build-matrix.yml
    with:
      checkout-ref: main
      artifact-name-prefix: nightly-artifacts
      artifact-retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────────
  # summary: collect job statuses and write a run-level summary
  # Runs after all build legs complete (or fail) and is always executed.
  # ──────────────────────────────────────────────────────────────────────────────
  summary:
    name: Nightly Summary
    runs-on: ubuntu-22.04
    needs: [matrix]
    if: always()

    steps:
      - name: Write run summary
        run: |
          {
            echo "## Nightly Build Summary"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Build Matrix (lint / typecheck / test / build) | ${{ needs.matrix.result }} |"
            echo ""
            echo "Artifacts retained for 14 days. See individual job logs for details."
          } >> "$GITHUB_STEP_SUMMARY"
