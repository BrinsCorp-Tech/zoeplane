name: Publish SDK

# Triggered by the same semver tag pattern as release.yml (v1.2.3).
# Both workflows fire on tag push — separate files, separate concerns:
#   release.yml  → signed platform binaries
#   publish-sdk.yml → npm publish of @zoeplane/plugin-sdk
#
# OPERATOR PREREQUISITE: The @zoeplane npm scope must be registered to
# BrinsCorp-Tech before this workflow can successfully publish. An automation
# token (granular: read+write for @zoeplane scope) must be created on npmjs.com
# and stored as the NPM_TOKEN repository secret. The workflow fails loudly if
# the secret is absent — no silent no-op.
#
# See README.md "Publishing the Plugin SDK" for full provisioning instructions.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  publish-sdk:
    name: Publish @zoeplane/plugin-sdk to npm
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck SDK (regression gate)
        # Run the SDK typecheck before building to catch any type errors
        # that would produce a broken published package.
        run: bun run --cwd packages/plugin-sdk typecheck

      - name: Build SDK (tsup)
        run: bun run --cwd packages/plugin-sdk build

      - name: Verify publish secrets
        # Fail loudly before attempting publish if the npm token is absent.
        # This prevents a silent no-op and makes the operator action obvious
        # in the workflow run log.
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret not configured. The @zoeplane npm scope must be registered to BrinsCorp-Tech and an automation token created at npmjs.com. See README.md publishing section."
            exit 1
          fi
          echo "NPM_TOKEN present — proceeding to publish."

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --access public
        working-directory: packages/plugin-sdk

      - name: Cleanup npm auth
        if: always()
        run: rm -f ~/.npmrc
